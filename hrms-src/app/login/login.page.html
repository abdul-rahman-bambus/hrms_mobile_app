<ion-header class="header-premium">
  <ion-toolbar class="toolbar-premium">
    <ion-title class="title-main">{{"LOGIN" | translate}}</ion-title>

    <ion-buttons slot="end" class="nav-buttons">
      <ion-select #langSelect [(ngModel)]="selectedLanguage" (ionChange)="changeLanguage()" [style.display]="'none'">
        @for (lang of languages; track lang) {
          <ion-select-option [value]="lang.code">
            {{ lang.label }}
          </ion-select-option>
        }
      </ion-select>
      <ion-button (click)="openLang()" style="--background:transparent;--box-shadow:none">
        <ion-icon name="language-outline"></ion-icon>

      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

<!-- Main Content -->
<main class="app-content">

  <!-- Animated Logo Section -->
  <div class="logo-container">
    <div class="logo-circle" id="main-logo-container">
      <!-- Main Logo SVG injected here by JS -->
      <img height="90" width="90" style="border-radius: 50%;" src="/assets/icon.png" />
    </div>
    <div class="spinner-dot-circle dot-circle-1"></div>
    <div class="spinner-dot-circle dot-circle-2"></div>
  </div>

  <!-- Header Text -->
  <h1 class="welcome-text">{{"COME_IN" | translate}}!</h1>
  <p class="subtitle"></p>

  <!-- Login Card -->
  <div class="login-card">

    <!-- PIN Login Form -->
    @if (isPinSet) {
      <div id="pinLogin">
        <div class="input-group">
          <label class="input-label">{{"ENTER_PIN" | translate}}</label>
          <input type="password" id="pinInput" pattern="[0-9]*" (keyup.enter)="loginWithPin()" inputmode="numeric" [(ngModel)]="pin" maxlength="6" class="input-field" placeholder="••••••">
        </div>
        <button class="login-button" (click)="loginWithPin()">
          {{"LOGIN_WITH_PIN" | translate}}
        </button>
      </div>
    }

    <!-- Credential Login Form (Default) -->
    @if (!isPinSet) {
      <div id="credentialLogin">
        <div class="input-group">
          <label class="input-label">{{'SERVER_URL' | translate}}</label>
          <!-- Placeholder added for context -->
          <input type="text" id="urlInput" #urlInput [(ngModel)]="url" (keyup.enter)="usernameField.focus()" class="input-field" placeholder="https://www.example.com">
        </div>
        <div class="input-group">
          <label class="input-label">{{"USERNAME" | translate}}</label>
          <!-- Placeholder added for context -->
          <input type="text" #usernameField id="usernameInput" (keyup.enter)="passwordField.focus()" [(ngModel)]="username" class="input-field"
            placeholder="user@company.com">
        </div>
        <div class="input-group mb-6">
          <label class="input-label">{{"PASSWORD" | translate}}</label>
          <input type="password" id="passwordInput" (keyup.enter)="loginWithCredentials()" #passwordField class="input-field" [(ngModel)]="password" placeholder="••••••••">
        </div>
        <button class="login-button" (click)="loginWithCredentials()">
          {{ 'LOGIN' | translate }}
        </button>

      </div>
      <div class="registration-section">
  <p class="registration-text">{{"FOR_REGISTRATION" | translate}}</p>
  <button class="contact-button" (click)="contactUs()">
    {{"CONTACT_US" | translate}}
  </button>
</div>
    }
  </div>
</main>
</ion-content>
