<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{"COMPANY" | translate}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="header-section">
    <h2>{{"SELECT_WORKSPACE" | translate}}</h2>
    <p>{{"CHOOSE_COMPANY" | translate}}</p>
  </div>

  <ion-list lines="none">

    @for (company of companies(); track company) {
    <ion-item class="company-item" [class.selected-item]="selectedCompanyId() === company.id" button detail="false"
      (click)="selectCompany(company)">
      <ion-label>
        {{ company.name }}
      </ion-label>
      @if (selectedCompanyId() === company.id) {
      <div class="custom-checkmark" slot="end">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
        </svg>
      </div>
      }
    </ion-item>
    }

  </ion-list>

</ion-content>
<ion-footer class="ion-no-border">
  <ion-toolbar>
    <ion-icon id="footer-button" name="chevron-forward-circle" (click)="setCompanyAndProceed()"></ion-icon>
  </ion-toolbar>
</ion-footer>
